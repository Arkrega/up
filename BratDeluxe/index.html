<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bratvid Deluxe — ArkRega</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="brand-badge">ArkRega</div>
            <h1>Bratvid Deluxe</h1>
            <p class="subtitle">Generator Teks Animasi Bratvid Versi Upgrade dengan Resolusi Penuh</p>
        </header>

        <div class="card">
            <div class="form-group">
                <label for="inputText">Teks Kalimat</label>
                <textarea id="inputText" placeholder="Ketik teks di sini..."></textarea>
            </div>

            <div class="form-group">
                <label>Pilihan Tema</label>
                <div class="theme-selector">
                    <label class="theme-option">
                        <input type="radio" name="theme" value="white" checked>
                        <div class="theme-card">
                            <span class="theme-swatch swatch-white"></span>
                            <span>White</span>
                        </div>
                    </label>
                    <label class="theme-option">
                        <input type="radio" name="theme" value="green">
                        <div class="theme-card">
                            <span class="theme-swatch swatch-green"></span>
                            <span>Green</span>
                        </div>
                    </label>
                    <label class="theme-option">
                        <input type="radio" name="theme" value="black">
                        <div class="theme-card">
                            <span class="theme-swatch swatch-black"></span>
                            <span>Black</span>
                        </div>
                    </label>
                </div>
            </div>

            <div class="grid-controls">
                <div class="form-group">
                    <label for="blurInput">
                        <span>Tingkat Blur</span>
                        <span class="value-tag" id="blurValueDisplay">0</span>
                    </label>
                    <div class="slider-wrapper">
                        <input type="range" id="blurInput" min="0" max="3" step="1" value="0">
                    </div>
                </div>

                <div class="form-group">
                    <label for="holdInput">
                        <span>Durasi Tahan (Detik)</span>
                    </label>
                    <div class="number-input-wrapper">
                        <input type="number" id="holdInput" min="0.1" step="0.1" value="1.5">
                    </div>
                </div>
            </div>

            <button class="primary-btn" id="generateBtn">
                <span class="loader-spinner" id="btnSpinner"></span>
                <span id="btnText">Generate Bratvid</span>
            </button>

            <div class="error-message" id="errorBox"></div>

            <div class="preview-box" id="previewArea">
                <div class="video-container">
                    <video id="resultVideo" controls loop playsinline></video>
                </div>
                <button class="download-btn" id="downloadBtn">Download Video (MP4)</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
